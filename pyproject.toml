[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7", "typer>=0.12,<1", "jsonschema>=4,<5", "openai>=1,<3"]

[project.scripts]
hpx = "hpx.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
